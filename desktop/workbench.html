<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管家工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, .1);
      --accent: #0a84ff;
      --danger: #ff3b30;
      --ok: #34c759;
      --warn: #ff9f0a;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255, 255, 255, .12);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      position: sticky;
      top: 0;
      backdrop-filter: blur(20px);
      z-index: 2;
    }
    .head-text { flex: 1; min-width: 0; }
    h1 { font-size: 18px; margin: 0; }
    .subtitle { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .status { color: var(--muted); font-size: 12px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 7px 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .45; cursor: default; }
    nav {
      display: flex;
      gap: 6px;
      padding: 12px 20px 0;
      flex-wrap: wrap;
    }
    nav button {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
    }
    nav button.active { background: var(--panel); color: var(--text); }
    .nav-count {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      margin-left: 4px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      line-height: 1;
    }
    main { padding: 16px 20px 32px; max-width: 980px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .body { white-space: pre-wrap; line-height: 1.55; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      background: color-mix(in srgb, var(--text) 10%, transparent);
      color: var(--muted);
    }
    .badge.running { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .badge.pending { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
    .badge.failed { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
    .empty { color: var(--muted); padding: 24px 4px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.6; margin: 0; }
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      width: 100%;
      margin-bottom: 7px;
    }
    textarea { resize: vertical; line-height: 1.5; }
    .actions input, .actions select { width: auto; margin-bottom: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .subcard { margin-left: 14px; background: color-mix(in srgb, var(--panel) 84%, var(--bg)); }
    .task-detail {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .task-detail h2 { font-size: 14px; margin: 18px 0 8px; }
    .timeline { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
    .timeline-row { border-left: 2px solid var(--line); padding-left: 10px; }
    .timeline-row .body { font-size: 12px; color: var(--muted); }
    .task-input { min-width: 220px; }

    .task-head { display: flex; align-items: flex-start; gap: 10px; }
    .task-head h3 { flex: 1; margin: 0; overflow-wrap: anywhere; }
    .task-head .badge { flex: 0 0 auto; margin-top: 1px; }
    .steps { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .steps strong { color: var(--text); font-weight: 600; }
    .quick-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .quick-actions .hint { margin: 0; }
    .fold { margin: 0 0 12px; }
    .fold > summary {
      cursor: pointer;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      list-style-position: inside;
    }
    .fold[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .fold > section, .fold > .card { margin-top: 0; }
    .detail-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
    .access-intro { margin-bottom: 12px; }
    @media (max-width: 620px) {
      header { flex-wrap: wrap; }
      .head-text { flex-basis: 100%; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="head-text">
      <h1>管家工作台</h1>
      <span class="subtitle">安排任务、处理待办、查看今天的简报</span>
    </div>
    <span id="status" class="status">正在连接…</span>
    <button id="refresh" class="secondary" type="button">刷新</button>
  </header>
  <nav>
    <button type="button" data-tab="tasks" class="active">任务</button>
    <button type="button" data-tab="pending">待处理 <span id="pending-count" class="nav-count" hidden>0</span></button>
    <button type="button" data-tab="brief">今日简报</button>
    <button type="button" data-tab="access">接入设置</button>
  </nav>
  <main>
    <section id="panel-tasks"></section>
    <section id="panel-pending" hidden></section>
    <section id="panel-brief" hidden></section>
    <section id="panel-access" hidden>
      <div class="hint access-intro">接入设置是可选的。日常只需要在「任务」里告诉管家做什么，不需要先配置这里。</div>
      <section id="panel-health"></section>
      <details class="fold">
        <summary>渠道与邮箱</summary>
        <section id="panel-channels"></section>
      </details>
      <details class="fold">
        <summary>网页采集（高级）</summary>
        <section id="panel-web"></section>
      </details>
    </section>
  </main>
  <script src="workbench.js"></script>
</body>
</html>
