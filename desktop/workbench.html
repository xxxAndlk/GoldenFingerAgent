<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, .1);
      --accent: #0a84ff;
      --danger: #ff3b30;
      --ok: #34c759;
      --warn: #ff9f0a;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255, 255, 255, .12);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      position: sticky;
      top: 0;
      backdrop-filter: blur(20px);
      z-index: 2;
    }
    h1 { font-size: 18px; margin: 0; flex: 1; }
    .status { color: var(--muted); font-size: 12px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 7px 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .45; cursor: default; }
    nav {
      display: flex;
      gap: 6px;
      padding: 12px 20px 0;
      flex-wrap: wrap;
    }
    nav button {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
    }
    nav button.active { background: var(--panel); color: var(--text); }
    main { padding: 16px 20px 32px; max-width: 980px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .body { white-space: pre-wrap; line-height: 1.55; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      background: color-mix(in srgb, var(--text) 10%, transparent);
      color: var(--muted);
    }
    .badge.running { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .badge.pending { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
    .badge.failed { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
    .empty { color: var(--muted); padding: 24px 4px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.6; margin: 0; }
    input[type="text"], input[type="date"], select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>工作台</h1>
    <span id="status" class="status">正在连接…</span>
    <button id="refresh" class="secondary" type="button">刷新</button>
    <button id="generate" type="button">生成今日简报</button>
  </header>
  <nav>
    <button type="button" data-tab="pending" class="active">待处理</button>
    <button type="button" data-tab="running">进行中</button>
    <button type="button" data-tab="brief">今日简报</button>
    <button type="button" data-tab="channels">渠道采集</button>
  </nav>
  <main>
    <section id="panel-pending"></section>
    <section id="panel-running" hidden></section>
    <section id="panel-brief" hidden></section>
    <section id="panel-channels" hidden></section>
  </main>
  <script src="workbench.js"></script>
</body>
</html>
