<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC Switch 代理与额度</title>
  <link rel="stylesheet" href="windows.css">
</head>
<body>
  <main class="aux-shell ccswitch-shell">
    <header class="aux-header">
      <div><h1>CC Switch</h1><p>代理供应商、用量与额度；密钥不会显示</p></div>
      <button id="providers-load" class="secondary-button">刷新用量</button>
    </header>
    <section class="window-section">
      <div class="setting-row">
        <label for="provider-type">工具类型</label>
        <select id="provider-type">
          <option value="">全部</option>
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="pi">Pi</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <p class="section-description">目前仅 Claude Code 支持确认后备份切换；其他供应商只读。</p>
    </section>
    <div id="provider-status" class="status-text list-status">尚未读取</div>
    <section id="provider-list" class="provider-list"></section>
  </main>
  <script src="ccswitch.js"></script>
</body>
</html>
