<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http://127.0.0.1:8080; media-src http://127.0.0.1:8080; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金手指管家</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app-icon.css">
</head>
<body>
  <button id="orb" class="orb" aria-label="展开金手指管家" aria-busy="false">
    <span class="orb-rail" aria-hidden="true"></span>
    <span class="orb-ring" aria-hidden="true"></span>
    <span id="orb-dot" class="orb-dot" hidden></span>
    <span class="orb-hit" aria-hidden="true"></span>
  </button>

  <main id="panel" class="panel" hidden>
    <header class="titlebar">
      <div class="title-block">
        <strong>金手指管家</strong>
        <span id="connection" class="connection">正在连接…</span>
      </div>
      <div class="title-actions">
        <label class="switch collab-switch" title="协作模式：开启后记录页面内容并定时总结">
          <input id="main-collab-toggle" type="checkbox" aria-label="协作模式">
          <span></span>
        </label>
        <button id="history-toggle" class="icon-button" aria-label="对话历史" title="对话历史">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3"/><path d="M12 7.4V12l3.2 2"/></svg>
        </button>
        <button id="workbench-toggle" class="icon-button workbench-button" aria-label="打开工作台" title="工作台：任务进度、待处理、今日简报">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          <span class="workbench-label">工作台</span>
          <span id="workbench-dot" class="workbench-dot" hidden></span>
        </button>
        <button id="theme-toggle" class="icon-button" aria-label="切换亮暗模式" title="切换亮暗模式">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.6 12H5M19 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11z"/></svg>
        </button>
        <button id="agents-toggle" class="icon-button" aria-label="打开设置" title="设置与 Agent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5.5M14.5 9H20"/><path d="M4 15h9.5M18.5 15H20"/><circle cx="12" cy="9" r="2.3"/><circle cx="16" cy="15" r="2.3"/></svg>
        </button>
        <button id="collapse" class="icon-button" aria-label="关闭" title="关闭，后台继续运行">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="agent-strips">
      <button id="pending-strip" class="pending-strip" type="button" hidden>
        <span class="pending-strip-dot" aria-hidden="true"></span>
        <span id="pending-strip-text">有待处理事项</span>
        <span class="pending-strip-arrow" aria-hidden="true">›</span>
      </button>

      <button id="brief-card" class="brief-card" type="button" hidden>
        <span class="brief-card-label">今日简报</span>
        <span id="brief-card-text"></span>
        <span class="pending-strip-arrow" aria-hidden="true">›</span>
      </button>
    </div>

    <span id="main-collab-status" class="visually-hidden" role="status">未授权，不会观察</span>

    <section id="history-panel" class="history-panel" aria-label="对话历史" hidden>
      <header class="history-head">
        <strong>对话历史</strong>
        <div class="history-head-actions">
          <button id="history-new" class="history-new" type="button">回到主会话</button>
          <button id="history-close" class="icon-button history-close" type="button" aria-label="关闭">×</button>
        </div>
      </header>
      <div class="history-toolbar">
        <input id="history-date" type="date" aria-label="按日期查找对话">
        <button id="history-clear-date" class="history-clear" type="button">全部</button>
      </div>
      <div id="history-list" class="history-list" aria-live="polite"></div>
    </section>

    <div class="workspace-grid">
      <section class="chat-column">
        <section id="messages" class="messages" aria-live="polite">
          <article class="message assistant"><p>我是金手指管家，可以对话、记录和调度其他 Agent。要安排长期任务时，点右上角「工作台」；待办和验收也会在那里提醒你。</p></article>
        </section>
        <button id="summary-line" class="summary-line" type="button" hidden>
          <span class="summary-line-dot" aria-hidden="true"></span>
          <span>已产生 <strong id="summary-count">0</strong> 条总结，点击查看</span>
          <span class="summary-line-arrow" aria-hidden="true">›</span>
        </button>
        <div id="chat-status" class="chat-status" hidden>
          <span class="status-dot"></span>
          <span id="chat-status-text">正在思考…</span>
        </div>
        <div id="attachments" class="attachments" hidden></div>
        <form id="chat-form" class="composer">
          <button id="attach" class="attach-button" type="button" aria-label="添加图片或视频" title="添加图片或视频">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.8 12.6l6.1-6.1a2.9 2.9 0 0 1 4.1 4.1l-7.4 7.4a4.3 4.3 0 0 1-6.1-6.1l6.8-6.8"/><path d="M8.2 15.8l6.2-6.2"/></svg>
          </button>
          <textarea id="chat-input" rows="1" maxlength="8000" placeholder="问点什么，或让我记一下…" aria-label="对话内容"></textarea>
          <button id="send" type="submit">发送</button>
        </form>
        <input id="attach-input" type="file" accept="image/*,video/*" multiple hidden>
      </section>
    </div>
  </main>

  <div id="summary-modal" class="summary-modal" hidden>
    <section class="summary-dialog" role="dialog" aria-modal="true" aria-labelledby="summary-title">
      <header class="summary-dialog-head">
        <div>
          <strong id="summary-title">工作总结</strong>
          <small id="summary-subtitle">已产生的阶段总结</small>
        </div>
        <button id="summary-close" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>
      <div id="summary-list" class="summary-list"></div>
    </section>
  </div>
  <script src="markdown.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
