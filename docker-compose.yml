services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gfa
      POSTGRES_PASSWORD: gfa
      POSTGRES_DB: gfa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
